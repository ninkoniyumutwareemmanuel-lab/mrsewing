<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Women's Custom Suits & Tailored Fashion Kigali | Mr. Sewing</title>

  <!-- High-Impact Local SEO Meta Tags -->

  <meta name="keywords" content="women suit Kigali, white power pantsuit Kigali, double breasted blazer set Rwanda, custom women suits Rwanda, female bespoke suits Kigali, tailored ladies blazer Kigali, women power suits Rwanda, female tailor in Kigali">
  <meta name="author" content="Mr. Sewing">
  <meta name="theme-color" content="#0b0b0b">
  <link rel="canonical" href="https://mrsewingfashion.com/womensuits.html">

  <link rel="icon" href="/MR%20LOGO.jpeg" type="image/jpeg">
  <link rel="apple-touch-icon" href="/MR%20LOGO.jpeg">

  <!-- Open Graph & Social Cards -->
  <meta property="og:site_name" content="Mr. Sewing">
  <meta property="og:title" content="Women's Custom Suits & Tailored Fashion Kigali | Mr. Sewing">
  <meta property="og:description" content="Luxury tailored women's suits, corporate power blazers, and custom evening wear in Kigali, Rwanda. Book your fitting today.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mrsewingfashion.com/womensuits.html">
  <meta property="og:image" content="https://mrsewingfashion.com/1.jpeg">

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Google Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProductCollection",
    "name": "Women's Custom Suit & Blazer Collection by Mr. Sewing",
    "description": "Bespoke women's suits, corporate power blazers, and custom tailoring for ladies in Kigali, Rwanda.",
    "url": "https://mrsewingfashion.com/womensuits.html",
    "provider": {
      "@type": "ClothingStore",
      "name": "Mr. Sewing",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Kigali",
        "addressCountry": "RW"
      }
    }
  }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; color-scheme: dark; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0b0b; color: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; }

    #site-header, #site-footer { width: 100%; }

    .gallery-container {
      flex: 1;
      max-width: 1600px;
      margin: 0 auto;
      padding: clamp(30px, 6vw, 80px) 4%;
      width: 100%;
    }

    .gallery-intro {
      text-align: center;
      margin-bottom: clamp(30px, 5vw, 60px);
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }

    .gallery-intro h1 {
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      color: #d4af37;
      text-transform: uppercase;
      letter-spacing: clamp(1px, 0.3vw, 3px);
      font-weight: 800;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .gallery-intro p {
      font-size: clamp(0.88rem, 1.6vw, 1.1rem);
      color: #cccccc;
      line-height: 1.7;
    }

    .gallery-divider {
      height: 2px;
      width: 80px;
      background-color: #d4af37;
      margin: 20px auto 0;
    }

    /* 4-Column Responsive Layout */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(16px, 2.5vw, 30px);
    }

    /* Card Styling matching exact screenshot design */
    .photo-card {
      background-color: #0d0d0d;
      border: 1px solid #222222;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .photo-card:hover {
      border-color: #d4af37;
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.15);
    }

    .photo-img-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background-color: #000000;
    }

    .photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      transition: transform 0.5s ease;
    }

    .photo-card:hover .photo-img { transform: scale(1.04); }

    /* Exact Text & Button Section Layout */
    .photo-info {
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background-color: #0b0b0b;
      flex-grow: 1;
      justify-content: space-between;
    }

    .photo-title-text {
      color: #ffffff;
      font-size: clamp(0.9rem, 1.3vw, 1.15rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .photo-subtitle-text {
      color: #d4af37;
      font-size: clamp(0.78rem, 1.1vw, 0.92rem);
      font-style: italic;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .view-details-btn {
      width: 100%;
      background: transparent;
      border: 1px solid #d4af37;
      color: #ffffff;
      padding: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-decoration: none;
      border-radius: 4px;
      transition: all 0.3s ease;
      display: inline-block;
      text-align: center;
    }

    .view-details-btn:hover {
      background-color: #d4af37;
      color: #000000;
    }

    .scroll-loader {
      text-align: center;
      padding: 40px 0;
      color: #d4af37;
      font-size: 1.1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      display: none;
    }
    .scroll-loader i { margin-right: 8px; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    @media (max-width: 1200px) { .photo-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 900px) { .photo-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) {
      .photo-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .photo-info { padding: 12px 8px; }
      .photo-title-text { font-size: 0.78rem; }
      .photo-subtitle-text { font-size: 0.7rem; margin-bottom: 10px; }
      .view-details-btn { padding: 8px 4px; font-size: 0.72rem; }
    }
  </style>
</head>
<body>

  <!-- Shared Header Placeholder -->
  <div id="site-header"></div>

  <!-- Main Content -->
  <main class="gallery-container">
    <div class="gallery-intro">
      <h1>Women's Custom Suit &amp; Fashion Collection</h1>
      <p>Sophisticated power dressing tailored for the modern woman. Discover tailored women's suit sets, corporate blazers, bespoke evening wear, and custom alterations by Mr. Sewing in Kigali, Rwanda.</p>
      <div class="gallery-divider"></div>
    </div>

    <!-- Photo Cards Grid -->
    <div class="photo-grid" id="photoGrid"></div>

    <!-- Scroll Loader -->
    <div class="scroll-loader" id="scrollLoader">
      <i class="fas fa-spinner"></i> Loading More Women's Suits...
    </div>
  </main>

  <!-- Shared Footer Placeholder -->
  <div id="site-footer"></div>

  <script>
    // Women's Suits Registry
    const womenPhotos = [
      { id: "women-photo-1", file: "1.jpeg", title: "WHITE POWER PANTSUIT", subtitle: "The Elegance Series", target: "photo-1.html" },
      { id: "women-photo-2", file: "2.jpeg", title: "DOUBLE-BREASTED BLAZER SET", subtitle: "The Elegance Series", target: "photo-2.html" },
      { id: "women-photo-3", file: "3.jpeg", title: "CLASSIC 3-PIECE EXECUTIVE", subtitle: "The Executive Line", target: "photo-3.html" },
      { id: "women-photo-4", file: "4.jpeg", title: "BESPOKE FEMALE EXECUTIVE", subtitle: "The Elegance Series", target: "photo-4.html" }
    ];

    document.addEventListener('DOMContentLoaded', function() {
      fetch('header.html').then(r => r.ok ? r.text() : '').then(d => { if (d) document.getElementById('site-header').innerHTML = d; });
      fetch('footer.html').then(r => r.ok ? r.text() : '').then(d => { if (d) document.getElementById('site-footer').innerHTML = d; });
      renderWomenGrid();
      setupInfiniteScroll();
    });

    function renderWomenGrid() {
      const grid = document.getElementById('photoGrid');
      grid.innerHTML = '';

      womenPhotos.forEach(photo => {
        const card = document.createElement('article');
        card.className = 'photo-card';
        card.innerHTML = `
          <div class="photo-img-wrapper">
            <a href="${photo.target}">
              <img src="${photo.file}" alt="${photo.title} - ${photo.subtitle} by Mr. Sewing Kigali" class="photo-img" loading="lazy">
            </a>
          </div>
          <div class="photo-info">
            <div>
              <div class="photo-title-text">${photo.title}</div>
              <div class="photo-subtitle-text">${photo.subtitle}</div>
            </div>
            <a href="${photo.target}" class="view-details-btn">VIEW DETAILS</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function setupInfiniteScroll() {
      let isFetching = false;
      window.addEventListener('scroll', function() {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 400) {
          if (!isFetching) {
            isFetching = true;
            const loader = document.getElementById('scrollLoader');
            loader.style.display = 'block';
            setTimeout(() => {
              loader.style.display = 'none';
              isFetching = false;
            }, 800);
          }
        }
      });
    }
  </script>
</body>
</html>
