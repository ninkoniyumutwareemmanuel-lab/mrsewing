name: R58 original homepage parity to main (staging only)
on:
  push:
    branches:
      - work/r58-restore-main-homepage-2026-11-22
      - phase1/customer-journey-repairs
    paths:
      - 'index.html'
      - 'assets/homepage.js'
      - '_templates/homepage*'
      - 'scripts/build_homepage.py'
      - 'scripts/homepage_galleries.py'
      - '.github/workflows/r56-homepage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  homepage-main-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure staged homepage files are byte-identical to approved main snapshot
        run: |
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "f07e3b3839b0faf133af77f3aca62779b3369be5"
          for p in \
            index.html \
            assets/homepage.js \
            _templates/homepage.html \
            _templates/homepage-sections.html \
            _templates/homepage-galleries.css \
            _templates/homepage-galleries.js \
            scripts/build_homepage.py \
            scripts/homepage_galleries.py; do
            git show "FETCH_HEAD:$p" | cmp - "$p"
            echo "PASS: exactly main — $p"
          done
      - name: Verify unchanged generated site and current Terms functionality
        run: |
          python scripts/build_site.py --check
          python tests/terms_reader_main_base.py
          python tests/seo_preservation.py
          python tests/sitemap_discovery.py
          python -m py_compile scripts/build_homepage.py scripts/homepage_galleries.py
