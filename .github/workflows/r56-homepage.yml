name: R57 preserve original homepage, surgical enhancements
on:
  push:
    branches:
      - work/r57-preserve-existing-homepage-2026-11-21
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check-original-and-additions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild full site and check generated consistency
        run: |
          python scripts/build_site.py
          python scripts/build_site.py --check
      - name: Run homepage preservation, permissions and SEO tests
        run: |
          python tests/homepage_r57.py
          python tests/seo_preservation.py
          python tests/sitemap_discovery.py
          python tests/terms_reader_main_base.py
          python -m py_compile scripts/homepage_galleries.py scripts/homepage_r57_additions.py scripts/build_homepage.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile/desktop browser test tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify original homepage and new additions in Chromium
        run: |
          python -m http.server 8020 --bind 127.0.0.1 > /tmp/r57-server.log 2>&1 &
          node tests/homepage_r57_browser.cjs
      - name: Keep original-layout review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r57-original-homepage-with-surgical-additions
          path: artifacts/r57-preserved-homepage/*.png
          if-no-files-found: ignore
      - name: Commit only the homepage's generated HTML and JS
        if: success()
        run: |
          git add -- index.html assets/homepage.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "R57: synchronize generated original-layout homepage with requested additions"
            git push origin HEAD:work/r57-preserve-existing-homepage-2026-11-21
          else
            echo "PASS: generated homepage matches committed source."
          fi
