name: R56 tailoring-first homepage staging verification
on:
  push:
    branches:
      - work/r56-tailoring-first-homepage-2026-11-21
      - phase1/customer-journey-repairs
    paths:
      - 'scripts/build_homepage.py'
      - 'scripts/homepage_redesign.py'
      - 'scripts/prepare_silent_homepage_videos.py'
      - '_templates/homepage*'
      - '_data/collection-designs.json'
      - '_data/collection-id-registry.json'
      - '_data/collection-image-inventory.json'
      - '_data/media-video-records.json'
      - 'index.html'
      - 'assets/homepage.js'
      - 'tests/homepage_r56.py'
      - 'tests/homepage_r56_browser.cjs'
      - '.github/workflows/r56-homepage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  homepage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build full existing site
        run: |
          python scripts/build_site.py
          python scripts/build_site.py --check
      - name: Install audio-removal tools for the isolated video check
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Prepare/check two nonpublic zero-audio R53 video derivatives
        run: |
          python scripts/prepare_silent_homepage_videos.py
      - name: R56 image/photo authorization and homepage source tests
        run: |
          python tests/homepage_r56.py
          python tests/seo_preservation.py
          python tests/sitemap_discovery.py
          python -m py_compile scripts/homepage_redesign.py scripts/build_homepage.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install supported Chromium QA tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify mobile/desktop homepage and reduced motion in browser
        run: |
          python -m http.server 8020 --bind 127.0.0.1 >/tmp/r56-server.log 2>&1 &
          node tests/homepage_r56_browser.cjs
      - name: Preserve homepage QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r56-homepage-mobile-desktop-screenshots
          path: artifacts/r56-homepage/*.png
          if-no-files-found: ignore
      - name: Check committed homepage HTML and JS match source build
        run: |
          git diff --exit-code -- index.html assets/homepage.js
