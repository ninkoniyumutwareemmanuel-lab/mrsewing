name: R59 staging tailoring-first build and regression
on:
  push:
    branches: [phase1/customer-journey-repairs]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-verify:
    if: "!contains(github.event.head_commit.message, '[generated]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: phase1/customer-journey-repairs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified silent-video preparation dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Create owner-authorized silent video files and matching still posters
        run: |
          mkdir -p assets/videos "$RUNNER_TEMP/mrsewing-silent"
          python scripts/prepare_silent_homepage_videos.py --output-dir "$RUNNER_TEMP/mrsewing-silent"
          cp "$RUNNER_TEMP/mrsewing-silent/1024X768VIDEO-silent.mp4" assets/videos/suit-light-silent.mp4
          cp "$RUNNER_TEMP/mrsewing-silent/1024X768black-silent.mp4" assets/videos/suit-black-silent.mp4
          ffmpeg -hide_banner -loglevel error -nostdin -y -ss 1 -i 1024X768VIDEO.mp4 -frames:v 1 -q:v 3 assets/videos/suit-light-poster.jpg
          ffmpeg -hide_banner -loglevel error -nostdin -y -ss 1 -i 1024X768black.mp4 -frames:v 1 -q:v 3 assets/videos/suit-black-poster.jpg
          test -s assets/videos/suit-light-silent.mp4
          test -s assets/videos/suit-black-silent.mp4
          test -s assets/videos/suit-light-poster.jpg
          test -s assets/videos/suit-black-poster.jpg
          python scripts/build_site.py
          python scripts/build_site.py --check
      - name: Build and check customer website
        run: |
          python scripts/build_site.py
          python scripts/build_site.py --check
      - name: Check metadata, routes, media, and Terms
        run: |
          python tests/seo_preservation.py
          python tests/sitemap_discovery.py
          python tests/terms_reader_main_base.py
          python tests/media_sorting_r59.py
          python tests/homepage_video_gate_r59.py
          python tests/held_media_redirects_r59.py
          python tests/shop_status_r59.py
          python scripts/prepare_silent_homepage_videos.py
          python -m py_compile scripts/build_homepage.py scripts/homepage_galleries.py scripts/customer_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser QA
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test staging-designed local browser at four widths
        run: |
          python -m http.server 8020 --bind 127.0.0.1 > /tmp/r59-http.log 2>&1 &
          node tests/r59_tailoring_browser.cjs
      - name: Save browser review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r59-staging-browser-screenshots
          path: artifacts/r59-browser/*.png
          if-no-files-found: ignore
      - name: Persist only generated changes already tracked in the staging checkout
        run: |
          git config user.name "mrsewing-staging-builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add assets/videos/suit-light-silent.mp4 assets/videos/suit-black-silent.mp4 assets/videos/suit-light-poster.jpg assets/videos/suit-black-poster.jpg
          if ! git diff --cached --quiet; then
            git commit -m "R59 staging generated page and asset sync [generated]"
            git push origin HEAD:phase1/customer-journey-repairs
          else
            echo "All committed pages already synchronized"
          fi
