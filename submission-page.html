<script>
    (async function loadComponents() {
      const components = [
        { id: 'site-header', file: 'header.html' },
        { id: 'site-footer', file: 'footer.html' }
      ];

      await Promise.allSettled(components.map(async (component) => {
        const mount = document.getElementById(component.id);
        if (!mount) return;
        try {
          const response = await fetch(component.file, { cache: 'no-cache' });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          mount.innerHTML = await response.text();
          mount.dataset.loaded = 'true';
        } catch (error) {
          console.error('Could not load ' + component.file + ':', error);
          mount.dataset.loaded = 'false';
        }
      }));

      document.documentElement.dataset.componentsLoaded = 'true';
      document.dispatchEvent(new CustomEvent('sitecomponentsloaded'));
    })();

    // Form Terms & Conditions toggle
    document.addEventListener('DOMContentLoaded', function () {
        var formTerms = document.getElementById('formTermsAgree');
        var submitBtn = document.getElementById('formSubmitBtn');

        if (formTerms && submitBtn) {
            formTerms.addEventListener('change', function () {
                submitBtn.disabled = !formTerms.checked;
            });
        }
    });

    // AJAX Submission Handling (Properly configured for File Uploads & Multipart Data)
    const submissionForm = document.getElementById('submissionForm');
    const successBox = document.getElementById('successBox');
    const debugMode = location.search.indexOf('debug=1') !== -1;

    function showError(message, reason) {
        alert(message + (debugMode ? '\n\nReason: ' + reason : ''));
    }

    if (submissionForm) {
        submissionForm.addEventListener('submit', function (e) {
            e.preventDefault();

            // Use FormData directly so files and text are packaged correctly together
            const formData = new FormData(submissionForm);
            
            if (!formData.get('Email') || !formData.get('Email').trim()) {
                formData.set('Email', 'Not provided');
            } else {
                formData.set('replyto', formData.get('Email').trim());
            }

            // Notice: NO 'Content-Type' header is set here. 
            // The browser automatically sets it to 'multipart/form-data' with the correct boundary for files.
            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(function(response) {
                return response.json().catch(function() { return {}; }).then(function(result) {
                    return { response: response, result: result };
                });
            })
            .then(function(output) {
                const response = output.response;
                const result = output.result;

                if (response.ok && result.success !== false) {
                    submissionForm.style.display = 'none';
                    successBox.style.display = 'block';
                } else {
                    const reason = (result && result.message) ? result.message : ('HTTP ' + response.status + ' ' + response.statusText);
                    console.error('Submission form was refused by Web3Forms:', reason);
                    showError('Something went wrong. Please try submitting again or contact us directly on WhatsApp.', reason);
                }
            })
            .catch(function(error) {
                console.error('Submission form could not reach Web3Forms:', error);
                showError('Form submission error. Please try again.', error && error.message ? error.message : String(error));
            });
        });
    }

    (function () {
        var modal = document.getElementById('orderModal');
        var agree = document.getElementById('termsAgree');
        var wa = document.getElementById('whatsappBtn');
        var hint = document.getElementById('termsHint');

        function openModal() { modal.classList.add('open'); }
        function closeModal() {
            modal.classList.remove('open');
            agree.checked = false;
            wa.setAttribute('aria-disabled', 'true');
            hint.textContent = '';
            if (location.hash === '#orderModal') {
                history.replaceState(null, '', location.pathname + location.search);
            }
        }

        document.addEventListener('click', function (e) {
            var btn = e.target.closest ? e.target.closest('.order-btn') : null;
            if (btn) { e.preventDefault(); openModal(); }
        });

        agree.addEventListener('change', function () {
            wa.setAttribute('aria-disabled', agree.checked ? 'false' : 'true');
            hint.textContent = '';
        });

        wa.addEventListener('click', function (e) {
            if (!agree.checked) {
                e.preventDefault();
                hint.textContent = 'Please agree to the Terms & Conditions to continue.';
            } else {
                setTimeout(closeModal, 300);
            }
        });

        var closeBtn = document.getElementById('orderClose');
        if (closeBtn) closeBtn.addEventListener('click', function (e) { e.preventDefault(); closeModal(); });
        modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

        if (location.hash === '#orderModal') { openModal(); }
    })();
</script>
