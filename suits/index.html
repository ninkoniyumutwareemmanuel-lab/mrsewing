    // Base raw file lists
    const rawFeaturedFiles = ['s1.jpeg', 's2.jpeg', 's3.jpeg', 's4.jpeg', 's5.jpeg'];
    const rawTwoPiecesFiles = ['w1.jpeg', 'w2.jpeg', 'w3.jpeg', 'w4.jpeg', 'w5.jpeg'];
    const rawThreePiecesFiles = ['m1.jpeg', 'm2.jpeg', 'm3.jpeg', 'm4.jpeg', 'm5.jpeg', 'm6.jpeg'];
    const rawMadeByUsFiles = ['r1.jpeg', 'r1.2.jpeg', 'r1.3.jpeg', 'r2.jpeg', 'r3.jpeg', 'r3.4.jpeg', 'r3.5.jpeg', 'r4.jpeg', 'r5.jpeg', 'r6.jpeg', 'r7.jpeg', 'r8.jpeg', 'r9.jpeg', 'r10.jpeg'];

    // 2. 24-Hour Midnight Shuffling Logic based on Rwanda Time (Africa/Kigali)
    function getDailyShuffledFiles(storageKey, array) {
      const todayKigali = new Date().toLocaleDateString('en-CA', { timeZone: 'Africa/Kigali' });
      try {
      let storedDate = localStorage.getItem(storageKey + '_date');
      let storedArr = localStorage.getItem(storageKey + '_arr');

      if (!storedDate || storedDate !== todayKigali || !storedArr) {
        let arr = [...array];
        // Shuffle algorithm
        for (let i = arr.length - 1; i > 0; i--) {
          let j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        localStorage.setItem(storageKey + '_date', todayKigali);
        localStorage.setItem(storageKey + '_arr', JSON.stringify(arr));
        return arr;
      } else {
        const parsed = JSON.parse(storedArr);
        return Array.isArray(parsed) && parsed.length === array.length && new Set(parsed).size === array.length && parsed.every(file => array.includes(file)) ? parsed : [...array];
      }
      } catch (error) { return [...array]; }
    }

    const featuredSuitsFiles = getDailyShuffledFiles('featuredSuits', rawFeaturedFiles);
    const twoPiecesFiles = getDailyShuffledFiles('twoPiecesSuits', rawTwoPiecesFiles);
    const threePiecesFiles = getDailyShuffledFiles('threePiecesSuits', rawThreePiecesFiles);
    const madeByUsFiles = getDailyShuffledFiles('madeByUs', rawMadeByUsFiles);

    // Carousel scroll helper for arrow buttons (< and >)
    function scrollCarousel(containerId, distance) {
      const container = document.getElementById(containerId);
      if (container) {
        container.scrollBy({ left: distance, behavior: 'smooth' });
      }
    }

    // Modern in-button copy feedback function
    function copyLinkWithFeedback(buttonElement, urlToCopy) {
      navigator.clipboard.writeText(urlToCopy).then(() => {
        const originalHTML = buttonElement.innerHTML;
        buttonElement.innerHTML = '<i class="fas fa-check"></i> Copied!';
        buttonElement.classList.add('copied');
        setTimeout(() => {
          buttonElement.innerHTML = originalHTML;
          buttonElement.classList.remove('copied');
        }, 2000);
      }).catch(err => {
        console.error('Copy failed: ', err);
      });
    }

    // Lightbox Elements
    const lightbox = document.getElementById('lightboxModal');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');

    function openLightbox(imgSrc) {
      lightboxImg.src = imgSrc;
      lightbox.classList.add('open');
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function(e) { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });

    function populateCarousel(fileList, containerId) {
