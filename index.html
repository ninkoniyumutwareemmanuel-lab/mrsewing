<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Sewing | Bespoke Tailoring & Custom Suits in Kigali, Rwanda</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Mr. Sewing is a bespoke tailor and fashion designer in Kigali, Rwanda, creating custom suits, formal wear, and made-to-measure clothing.">
    <meta name="keywords" content="Mr. Sewing, bespoke tailoring Kigali, custom suits Rwanda, wedding suits Kigali">
    <meta name="author" content="Mr. Sewing">
    <meta name="theme-color" content="#0b0b0b">

    <!-- Favicon -->
    <link rel="icon" href="/MR%20LOGO.jpeg" type="image/jpeg">
    <link rel="apple-touch-icon" href="/MR%20LOGO.jpeg">

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Global Page Setup */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0b0b; color: #f5f5f5; }

        /* Container Placeholders */
        #site-header,
        #hero-section,
        #customers-section,
        #collections-section,
        #why-mtm-section,
        #why-choose-section,
        #site-footer {
            width: 100%;
        }

        /* Order Modal Styling */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
        .modal-overlay.open, .modal-overlay:target { display: flex; }
        .modal-box { background-color: #141414; border: 1px solid #2a2a2a; border-top: 3px solid #d4af37; border-radius: 8px; max-width: 440px; width: 100%; padding: clamp(20px, 4vw, 32px); position: relative; }
        .modal-close { position: absolute; top: 6px; right: 12px; background: none; border: none; color: #aaaaaa; font-size: 1.8rem; cursor: pointer; }
        .modal-close:hover { color: #d4af37; }
        .modal-box h3 { color: #d4af37; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; font-size: 1.1rem; }
        .modal-box p { color: #aaaaaa; font-size: 0.92rem; line-height: 1.6; margin-bottom: 16px; }
        .terms-check { display: flex; gap: 10px; align-items: flex-start; color: #cccccc; font-size: 0.9rem; line-height: 1.5; margin-bottom: 20px; cursor: pointer; }
        .terms-check input { margin-top: 3px; width: 18px; height: 18px; accent-color: #d4af37; flex-shrink: 0; }
        .terms-check a { color: #d4af37; }
        .whatsapp-btn { display: block; text-align: center; background-color: #25D366; color: #000000; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.9rem; padding: 12px; border-radius: 4px; text-decoration: none; transition: opacity 0.3s ease; }
        .whatsapp-btn[aria-disabled="true"] { background-color: #2a2a2a; color: #777777; cursor: not-allowed; }
        .terms-hint { color: #d4af37; font-size: 0.8rem; margin-top: 10px; text-align: center; min-height: 1em; }
    </style>
</head>
<body>

    <!-- Modular Sections -->
    <div id="site-header"></div>
    <div id="hero-section"></div>
    <div id="customers-section"></div>
    <div id="collections-section"></div>
    <div id="why-mtm-section"></div>
    <div id="why-choose-section"></div>
    <div id="site-footer"></div>

    <!-- Order Modal Popup -->
    <div class="modal-overlay" id="orderModal" role="dialog" aria-modal="true" aria-labelledby="orderModalTitle">
        <div class="modal-box">
            <button class="modal-close" id="orderClose" aria-label="Close">&times;</button>
            <h3 id="orderModalTitle">Place Your Order</h3>
            <p>You will continue to WhatsApp to chat with Mr. Sewing and place your order.</p>
            <label class="terms-check">
                <input type="checkbox" id="termsAgree">
                <span>I have read and agree to the <a href="terms-and-conditions.html" id="termsLink" target="_blank" rel="noopener">Terms &amp; Conditions</a>.</span>
            </label>
            <a href="https://wa.me/250787411501?text=Hey%20Mr.%20Sewing%2C%20I%20need%20to%20place%20an%20order." target="_blank" rel="noopener" class="whatsapp-btn" id="whatsappBtn" aria-disabled="true"><i class="fab fa-whatsapp"></i> Continue to WhatsApp</a>
            <div class="terms-hint" id="termsHint"></div>
        </div>
    </div>

    <!-- Dynamic Section Loader Script -->
    <script>
        const components = [
            { id: 'site-header', file: 'header.html' },
            { id: 'hero-section', file: 'hero.html' },
            { id: 'customers-section', file: 'happy-customers.html' },
            { id: 'collections-section', file: 'collections.html' },
            { id: 'why-mtm-section', file: 'why-mtm.html' },
            { id: 'why-choose-section', file: 'why-choose.html' },
            { id: 'site-footer', file: 'footer.html' }
        ];

        components.forEach(comp => {
            fetch(comp.file)
                .then(res => res.text())
                .then(data => {
                    document.getElementById(comp.id).innerHTML = data;
                })
                .catch(err => console.error(`Error loading ${comp.file}:`, err));
        });

        // Modal Logic
        (function () {
            var modal = document.getElementById('orderModal');
            var agree = document.getElementById('termsAgree');
            var wa = document.getElementById('whatsappBtn');
            var hint = document.getElementById('termsHint');

            function openModal() { modal.classList.add('open'); }
            function closeModal() {
                modal.classList.remove('open');
                agree.checked = false;
                wa.setAttribute('aria-disabled', 'true');
                hint.textContent = '';
                if (location.hash === '#orderModal') {
                    history.replaceState(null, '', location.pathname + location.search);
                }
            }

            document.addEventListener('click', function (e) {
                var btn = e.target.closest ? e.target.closest('.order-btn') : null;
                if (btn) { e.preventDefault(); openModal(); }
            });

            agree.addEventListener('change', function () {
                wa.setAttribute('aria-disabled', agree.checked ? 'false' : 'true');
                hint.textContent = '';
            });

            wa.addEventListener('click', function (e) {
                if (!agree.checked) {
                    e.preventDefault();
                    hint.textContent = 'Please agree to the Terms & Conditions to continue.';
                } else {
                    setTimeout(closeModal, 300);
                }
            });

            document.getElementById('orderClose').addEventListener('click', function (e) { e.preventDefault(); closeModal(); });
            modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

            if (location.hash === '#orderModal') { openModal(); }
        })();
    </script>
</body>
</html>
