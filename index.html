<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Sewing</title>
  <style>
    /* Reset & Page Setup */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0b0b;
      color: #f5f5f5;
    }

    /* Header Bar */
    header {
      background-color: #141414;
      border-bottom: 1px solid #2a2a2a;
      padding: 12px 4%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap; /* Prevents items from wrapping onto new lines */
      gap: 10px;
    }

    /* Left: Logo Only */
    .header-logo {
      height: 45px;
      width: auto;
      object-fit: contain;
      display: block;
      mix-blend-mode: screen; /* Blends out dark logo background */
      flex-shrink: 0;
    }

    /* Center: Navigation Links */
    nav {
      flex-shrink: 1;
      overflow: hidden;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 20px;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    nav a {
      color: #cccccc;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #d4af37; /* Gold hover color */
    }

    /* Right: Order Button */
    .order-btn {
      background-color: #d4af37;
      color: #000000;
      padding: 8px 18px;
      text-decoration: none;
      font-weight: 700;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.85rem;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 0.3s ease;
    }

    .order-btn:hover {
      background-color: #f3e5ab;
    }

    /* Mobile Responsive Adjustments */
    @media (max-width: 600px) {
      header {
        padding: 10px 2%;
        gap: 6px;
      }

      .header-logo {
        height: 32px; /* Smaller logo for phones */
      }

      nav ul {
        gap: 8px; /* Tighter spacing between links */
      }

      nav a {
        font-size: 0.72rem; /* Compact font size for mobile */
      }

      .order-btn {
        padding: 6px 10px;
        font-size: 0.7rem; /* Smaller button padding & font */
      }
    }

    @media (max-width: 380px) {
      nav ul {
        gap: 5px;
      }

      nav a {
        font-size: 0.65rem;
      }

      .header-logo {
        height: 26px;
      }

      .order-btn {
        padding: 5px 8px;
        font-size: 0.65rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <!-- Left: Logo image only -->
    <img src="MR LOGO.jpeg" alt="Mr. Sewing Logo" class="header-logo">

    <!-- Center: Navigation Links -->
    <nav>
      <ul>
        <li><a href="#suits">Suits</a></li>
        <li><a href="#measurements">Measurements Guide</a></li>
        <li><a href="#faq">FAQ</a></li>
      </ul>
    </nav>

    <!-- Right: Order Button -->
    <a href="#order" class="order-btn">Order</a>
  </header>

</body>
</html>
