<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Sewing | Premium Fashion & Tailoring</title>
  <style>
    /* Reset & General Setup */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0b0b;
      color: #f5f5f5;
      line-height: 1.6;
    }

    /* Header & Navigation Bar */
    header {
      background-color: #141414;
      border-bottom: 1px solid #2a2a2a;
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      height: 50px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .brand-name {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #d4af37; /* Metallic Gold Accent */
      text-transform: uppercase;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 25px;
    }

    nav a {
      color: #cccccc;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #d4af37;
    }

    /* Hero Section */
    .hero {
      height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
      background: radial-gradient(circle at center, #1f1f1f 0%, #0b0b0b 100%);
    }

    .hero h1 {
      font-size: 3rem;
      color: #ffffff;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .hero p {
      font-size: 1.2rem;
      color: #aaaaaa;
      max-width: 600px;
      margin-bottom: 30px;
    }

    .cta-button {
      background-color: #d4af37;
      color: #000000;
      padding: 12px 30px;
      text-decoration: none;
      font-weight: 700;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background-color 0.3s ease;
    }

    .cta-button:hover {
      background-color: #f3e5ab;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid #1a1a1a;
      color: #666666;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Header with Brand Logo -->
  <header>
    <div class="logo-container">
      <img src="MR LOGO.jpg" alt="Mr. Sewing Logo" class="brand-logo">
      <span class="brand-name">Mr. Sewing</span>
    </div>
    <nav>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#collections">Collections</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Hero Section -->
  <section class="hero" id="home">
    <h1>Bespoke Fashion & Craftsmanship</h1>
    <p>Precision tailoring and custom apparel designed to fit your unique style.</p>
    <a href="#collections" class="cta-button">Explore Collection</a>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Mr. Sewing. All rights reserved.</p>
  </footer>

</body>
</html>
