    .faq-item { border: 1px solid #2a2a2a; border-radius: 6px; background: #0f0f0f; overflow: hidden; }
    .faq-item summary { cursor: pointer; color: #f5f5f5; font-weight: 600; padding: 15px 18px; line-height: 1.5; list-style: none; position: relative; padding-right: 42px; }
    .faq-item summary::-webkit-details-marker { display: none; }
    .faq-item summary::after { content: '+'; color: #d4af37; position: absolute; right: 18px; top: 12px; font-size: 1.35rem; }
    .faq-item[open] summary::after { content: '−'; }
    .faq-answer { padding: 0 18px 18px; }
    .faq-answer ul { padding-left: 22px; margin: 8px 0; }
    .faq-answer li { margin-bottom: 5px; }
    .price-note { margin-top: 12px; padding: 12px; background: #141414; border-left: 2px solid #d4af37; }
    .contact-card p + p { margin-top: 8px; }
    @media (max-width: 700px) {
      .about-grid, .contact-grid { grid-template-columns: 1fr; }
      .info-section { scroll-margin-top: 140px; }
    }

    /* Small screens: everything stays side by side; only the tightest spots adjust */
    @media (max-width: 700px) {
      header { flex-wrap: wrap; row-gap: 8px; }
      nav { order: 3; width: 100%; overflow: visible; }
      nav ul { gap: 8px 14px; flex-wrap: wrap; white-space: normal; }
      .collections-section, .why-mtm-section { scroll-margin-top: 140px; }
      .service-highlights { grid-template-columns: 1fr; }
      .customers-grid { grid-template-columns: 1fr; }
      .suit-image { aspect-ratio: 3 / 4; }
      .footer-top { grid-template-columns: repeat(2, 1fr); }
      .social-icons a { width: 42px; height: 42px; font-size: 1.2rem; }
    }
  
    /* Component mounts span the full viewport width without adding layout constraints. */
    .site-component { width: 100%; min-width: 0; }
    #main-content { display: block; width: 100%; }
    :focus-visible { outline: 2px solid #d4af37; outline-offset: 3px; }
  </style>
</head>
<body id="top">
  <!-- Shared site header: loaded from header.html -->
  <div id="site-header" class="site-component" aria-label="Website header"></div>

  <main id="main-content">
    <!-- Homepage components load in this exact order. Keep these IDs in sync with loadComponents(). -->
    <div id="hero-section" class="site-component"></div>
    <div id="customers-section" class="site-component"></div>
    <div id="collections-section" class="site-component"></div>
    <div id="services-section" class="site-component"></div>
    <div id="why-mtm-section" class="site-component"></div>
    <div id="why-choose-section" class="site-component"></div>
  </main>

  <!-- Shared site footer: loaded from footer.html -->
  <div id="site-footer" class="site-component"></div>

  <noscript>
    <p style="padding:20px;text-align:center;color:#f5f5f5;background:#141414;">
      Mr. Sewing Fashion — bespoke tailoring and custom suits in Kigali, Rwanda. Please enable JavaScript to view all website sections.
    </p>
  </noscript>

  <!-- Order popup: customer must agree to Terms & Conditions before WhatsApp opens -->
  <div class="modal-overlay" id="orderModal" role="dialog" aria-modal="true" aria-labelledby="orderModalTitle">
    <div class="modal-box">
      <button class="modal-close" id="orderClose" aria-label="Close">&times;</button>
      <h3 id="orderModalTitle">Place Your Order</h3>
      <p>You will continue to WhatsApp to chat with Mr. Sewing and place your order.</p>
      <label class="terms-check">
        <input type="checkbox" id="termsAgree">
        <span>I have read and agree to the <a href="#terms-and-conditions" id="termsLink">Terms &amp; Conditions</a>.</span>
      </label>
      <a href="https://wa.me/250787411501?text=Hey%20Mr.%20Sewing%2C%20I%20need%20to%20place%20an%20order." target="_blank" rel="noopener" class="whatsapp-btn" id="whatsappBtn" aria-disabled="true"><i class="fab fa-whatsapp"></i> Continue to WhatsApp</a>
      <div class="terms-hint" id="termsHint"></div>
    </div>
  </div>

  <script>
    /* GitHub Pages-compatible component loader. Files must be in the same folder as index.html. */
    (async function loadComponents() {
      const components = [
        { id: 'site-header', file: 'header.html' },
        { id: 'hero-section', file: 'hero.html' },
        { id: 'customers-section', file: 'happy-customers.html' },
        { id: 'collections-section', file: 'collections.html' },
        { id: 'services-section', file: 'services.html' },
        { id: 'why-mtm-section', file: 'why-mtm.html' },
        { id: 'why-choose-section', file: 'why-choose.html' },
        { id: 'site-footer', file: 'footer.html' }
      ];

      const results = await Promise.allSettled(components.map(async (component) => {
        const mount = document.getElementById(component.id);
        try {
          const response = await fetch(component.file, { cache: 'no-cache' });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          mount.innerHTML = await response.text();
          mount.dataset.loaded = 'true';
        } catch (error) {
          console.error('Could not load ' + component.file + ':', error);
          mount.innerHTML = '<section style="padding:16px 4%;color:#ccc;background:#141414">This section could not be loaded. Please refresh the page later.</section>';
          mount.dataset.loaded = 'false';
        }
      }));

      /* Announce when components are ready for accessibility and other scripts. */
      document.documentElement.dataset.componentsLoaded = 'true';
      document.dispatchEvent(new CustomEvent('sitecomponentsloaded', { detail: { results } }));
    })();

    /* Shared order modal: delegated clicks work for buttons injected from header/footer. */
    (function setupOrderModal() {
      const modal = document.getElementById('orderModal');
      const agree = document.getElementById('termsAgree');
      const whatsapp = document.getElementById('whatsappBtn');
      const hint = document.getElementById('termsHint');
      const closeButton = document.getElementById('orderClose');
      const termsLink = document.getElementById('termsLink');
      if (!modal || !agree || !whatsapp || !hint) return;

      function openModal() {
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
      }
      function closeModal() {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
        agree.checked = false;
        whatsapp.setAttribute('aria-disabled', 'true');
        hint.textContent = '';
        if (location.hash === '#orderModal') history.replaceState(null, '', location.pathname + location.search);
      }

      document.addEventListener('click', function (event) {
        const button = event.target.closest && event.target.closest('.order-btn');
        if (button) { event.preventDefault(); openModal(); }
      });
      agree.addEventListener('change', function () {
        whatsapp.setAttribute('aria-disabled', agree.checked ? 'false' : 'true');
        hint.textContent = '';
      });
      whatsapp.addEventListener('click', function (event) {
        if (!agree.checked) {
          event.preventDefault();
          hint.textContent = 'Please agree to the Terms & Conditions to continue.';
        } else {
          closeModal();
        }
      });
      if (termsLink) termsLink.addEventListener('click', closeModal);
      if (closeButton) closeButton.addEventListener('click', function (event) { event.preventDefault(); closeModal(); });
      modal.addEventListener('click', function (event) { if (event.target === modal) closeModal(); });
      document.addEventListener('keydown', function (event) { if (event.key === 'Escape') closeModal(); });
      if (location.hash === '#orderModal') openModal();
    })();
  </script>
</body>
</html>
