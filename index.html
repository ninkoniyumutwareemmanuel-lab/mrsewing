<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Sewing | Bespoke Tailoring & Custom Suits in Kigali, Rwanda</title>

    <meta name="description" content="Mr. Sewing is a bespoke tailor and fashion designer in Kigali, Rwanda, creating custom suits, formal wear, and made-to-measure clothing.">
    <meta name="keywords" content="Mr. Sewing, bespoke tailoring Kigali, custom suits Rwanda, wedding suits Kigali">
    <meta name="author" content="Mr. Sewing">
    <meta name="theme-color" content="#0b0b0b">

    <link rel="icon" href="/MR%20LOGO.jpeg" type="image/jpeg">
    <link rel="apple-touch-icon" href="/MR%20LOGO.jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0b0b; color: #f5f5f5; }

        /* Full width containers for each fetched module */
        #site-header,
        #hero-section,
        #customers-section,
        #collections-section,
        #why-mtm-section,
        #why-choose-section,
        #site-footer {
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Dynamic Section Containers -->
    <div id="site-header"></div>
    <div id="hero-section"></div>
    <div id="customers-section"></div>
    <div id="collections-section"></div>
    <div id="why-mtm-section"></div>
    <div id="why-choose-section"></div>
    <div id="site-footer"></div>

    <!-- Script to Load All Dedicated Section Files -->
    <script>
        const components = [
            { id: 'site-header', file: 'header.html' },
            { id: 'hero-section', file: 'hero.html' },
            { id: 'customers-section', file: 'happy-customers.html' },
            { id: 'collections-section', file: 'collections.html' },
            { id: 'why-mtm-section', file: 'why-mtm.html' },
            { id: 'why-choose-section', file: 'why-choose.html' },
            { id: 'site-footer', file: 'footer.html' }
        ];

        components.forEach(comp => {
            fetch(comp.file)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP error! Status: ${res.status}`);
                    return res.text();
                })
                .then(data => {
                    document.getElementById(comp.id).innerHTML = data;
                })
                .catch(err => console.error(`Error loading ${comp.file}:`, err));
        });
    </script>
</body>
</html>
