<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Sewing</title>
  <style>
    /* Reset & Page Setup */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0b0b;
      color: #f5f5f5;
    }

    /* Header Bar */
    header {
      background-color: #141414;
      border-bottom: 1px solid #2a2a2a;
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Left: Logo Only with Background Removal Trick */
    .header-logo {
      height: 50px;
      width: auto;
      object-fit: contain;
      display: block;
      /* Blends out the black background of the image onto dark background */
      mix-blend-mode: screen; 
    }

    /* Center: Navigation Links */
    nav ul {
      display: flex;
      list-style: none;
      gap: 30px;
      align-items: center;
    }

    nav a {
      color: #cccccc;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #d4af37; /* Gold hover color */
    }

    /* Right: Order Button */
    .order-btn {
      background-color: #d4af37;
      color: #000000;
      padding: 10px 24px;
      text-decoration: none;
      font-weight: 700;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background-color 0.3s ease;
    }

    .order-btn:hover {
      background-color: #f3e5ab;
    }
  </style>
</head>
<body>

  <header>
    <!-- Left: Logo image only -->
    <img src="MR LOGO.jpeg" alt="Mr. Sewing Logo" class="header-logo">

    <!-- Center: Navigation Links -->
    <nav>
      <ul>
        <li><a href="#suits">Suits</a></li>
        <li><a href="#measurements">Measurements Guide</a></li>
        <li><a href="#faq">FAQ</a></li>
      </ul>
    </nav>

    <!-- Right: Order Button -->
    <a href="#order" class="order-btn">Order</a>
  </header>

</body>
</html>
