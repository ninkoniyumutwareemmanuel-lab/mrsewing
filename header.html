<!-- Header HTML with Fixed Compact Dimensions -->
<style>
    /* Force Header Heights & Layout */
    header#home, 
    header, 
    #site-header header, 
    #header-placeholder header {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        background-color: #141414 !important;
        border-bottom: 1px solid #2a2a2a !important;
        padding: 10px 4% !important;
        position: sticky !important;
        top: 0 !important;
        z-index: 1000 !important;
        width: 100% !important;
        height: 70px !important;
        max-height: 70px !important;
        box-sizing: border-box !important;
    }

    /* Lock Logo Dimensions to Prevent Over-expansion */
    .header-logo {
        height: 38px !important;
        max-height: 38px !important;
        width: auto !important;
        object-fit: contain !important;
        display: block !important;
        mix-blend-mode: screen !important;
        flex-shrink: 0 !important;
    }

    /* Navigation Menu */
    header nav {
        flex-shrink: 1 !important;
        overflow: hidden !important;
    }

    header nav ul {
        display: flex !important;
        list-style: none !important;
        gap: 20px !important;
        align-items: center !important;
        justify-content: center !important;
        white-space: nowrap !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    header nav a {
        color: #cccccc !important;
        text-decoration: none !important;
        font-size: 0.9rem !important;
        font-weight: 500 !important;
        transition: color 0.3s ease !important;
    }

    header nav a:hover, 
    header nav a.active {
        color: #d4af37 !important;
    }

    /* Order Button */
    .order-btn {
        background-color: #d4af37 !important;
        color: #000000 !important;
        padding: 7px 16px !important;
        text-decoration: none !important;
        font-weight: 700 !important;
        border-radius: 4px !important;
        text-transform: uppercase !important;
        letter-spacing: 0.5px !important;
        font-size: 0.8rem !important;
        white-space: nowrap !important;
        flex-shrink: 0 !important;
        display: inline-block !important;
    }

    /* Mobile Responsive Breakpoint */
    @media (max-width: 700px) {
        header#home, header, #site-header header, #header-placeholder header {
            height: auto !important;
            max-height: none !important;
            flex-wrap: wrap !important;
            row-gap: 8px !important;
            padding: 8px 12px !important;
        }

        header nav {
            order: 3 !important;
            width: 100% !important;
        }

        header nav ul {
            gap: 8px 12px !important;
            flex-wrap: wrap !important;
            white-space: normal !important;
        }

        header nav a {
            font-size: 0.8rem !important;
        }

        .header-logo {
            height: 30px !important;
            max-height: 30px !important;
        }
    }
</style>

<header id="home">
    <img src="MR LOGO.jpeg" alt="Mr. Sewing Logo - Bespoke Tailor Kigali" class="header-logo">
    <nav aria-label="Main navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="suits.html">Suits</a></li>
            <li><a href="measurements.html">Measurements Guide</a></li>
            <li><a href="faq.html">FAQs</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>
    <a href="#orderModal" class="order-btn">Order</a>
</header>
