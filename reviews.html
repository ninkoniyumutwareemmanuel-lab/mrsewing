  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; color-scheme: dark; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0b0b; color: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; }

    #site-header { width: 100%; }

    .work-section { 
      flex: 1;
      padding: clamp(30px, 6vw, 90px) 4%; 
      max-width: 1500px; 
      margin: 0 auto; 
      width: 100%;
    }
    
    .section-header { text-align: center; margin-bottom: clamp(40px, 6vw, 70px); }
    .section-header h1 { font-size: clamp(1.4rem, 3.5vw, 2.8rem); color: #d4af37; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; margin-bottom: 15px; }
    .section-subtitle { color: #cccccc; font-size: clamp(0.95rem, 1.6vw, 1.15rem); margin: 0 auto; max-width: 800px; line-height: 1.7; font-style: italic; }
    .header-divider { height: 2px; width: 90px; background-color: #d4af37; margin: 20px auto 0; }

    /* Professional Grid Layout */
    .work-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: clamp(20px, 3vw, 35px);
      width: 100%;
    }

    .work-card {
      background-color: #141414;
      border: 1px solid #2a2a2a;
      border-top: 3px solid #d4af37;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .work-card:hover {
      border-color: #d4af37;
      transform: translateY(-6px);
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.15);
    }

    .work-image-wrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      cursor: zoom-in;
    }
    .work-img {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      object-position: center top;
      display: block;
      transition: transform 0.4s ease;
    }
    .work-card:hover .work-img {
      transform: scale(1.03);
    }

    .work-content {
      padding: clamp(16px, 2vw, 24px);
      text-align: left;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .work-tag {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #d4af37;
      font-weight: 600;
    }

    .work-title {
      font-size: clamp(1rem, 1.5vw, 1.2rem);
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .work-desc {
      font-size: 0.88rem;
      color: #aaaaaa;
      line-height: 1.6;
    }

    .detail-btn {
      display: inline-block;
      background-color: transparent;
      border: 1px solid #d4af37;
      color: #d4af37;
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 9px 18px;
      border-radius: 4px;
      text-decoration: none;
      text-align: center;
      transition: all 0.3s ease;
      margin-top: 5px;
    }
    .detail-btn:hover {
      background-color: #d4af37;
      color: #000000;
    }

    /* Full-Screen Lightbox Modal for Image Viewing */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 20px;
    }
    .lightbox-modal.open {
      display: flex;
    }
    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
    }
    .lightbox-content img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 6px;
      border: 1px solid #d4af37;
      display: block;
      margin: 0 auto;
    }
    .lightbox-close {
      position: absolute;
      top: -45px;
      right: 0;
      background: #141414;
      border: 1px solid #d4af37;
      color: #d4af37;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }
    .lightbox-close:hover {
      background: #d4af37;
      color: #000000;
    }

    @media (max-width: 600px) {
      .work-grid {
        grid-template-columns: 1fr;
      }
    }
    .seo-outline-heading { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
</style>
  <link rel="stylesheet" href="assets/gallery.css">
  <script src="assets/gallery.js" defer></script>
  <script src="assets/navigation.js" defer></script>
</head>
<body>

  <!-- Shared Header Placeholder -->
  <div id="site-header"></div>

  <!-- Main Work & Client Moments Gallery -->
  <main class="work-section">
    <div class="section-header">
      <h1>Our Work &amp; Client Moments</h1>
      <p class="section-subtitle">Real stories, bespoke fits, and cherished milestones crafted with precision in Kigali. Click any photo to view in full screen, or explore individual client stories.</p>
      <div class="header-divider"></div>
    </div>

    <h2 class="seo-outline-heading">Client Photo Portfolio</h2>
    <div class="work-grid" id="workGrid">
      <!-- Cards rendered dynamically via JavaScript to ensure 100% accurate file mapping -->
    </div>

  <!-- Full-Screen Lightbox Modal Container -->
  <div class="lightbox-modal" id="lightboxModal" role="dialog" aria-modal="true">
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightboxClose" aria-label="Close Lightbox">&times;</button>
      <img id="lightboxImage" src="" alt="Enlarged client moment preview">

  </div>

        .then(data => { if (data) document.getElementById('site-header').innerHTML = data; })
        .catch(err => console.error('Header load error:', err));

      // Complete audited inventory of primary image files (r1 to r43)
      const galleryItems = [
        { file: 'r1.jpeg', title: 'Bespoke Elegance in Kigali', desc: 'Crafted to perfection, celebrating our client\'s unique presence with bespoke tailoring.' },

        { file: 'r8.jpeg', title: 'Statement Formal Wear', desc: 'Designed to command attention at prestigious evening events and galas.' },
        { file: 'r9.jpeg', title: 'Heritage & Modern Fusion', desc: 'Blending cultural sophistication with modern tailoring lines.' },

        { file: 'r15.jpeg', title: 'Custom Blazer & Trouser', desc: 'Versatile smart-casual bespoke wear designed for effortless style.' },
        { file: 'r16.jpeg', title: 'Classic Double-Breasted', desc: 'Timeless sartorial sophistication with a modern tailored silhouette.' },
        { file: 'r17.jpeg', title: 'Sharply Fitted Elegance', desc: 'Engineered for confidence, comfort, and uncompromising distinction.' },
        { file: 'r18.jpeg', title: 'Bespoke Three-Piece', desc: 'Complete harmony in fabric, cut, and meticulous construction.' },
        { file: 'r19.jpeg', title: 'Modern Executive Style', desc: 'Sleek lines and premium materials tailored right in Nyarugenge.' },
        { file: 'r20.jpeg', title: 'Atelier Spotlight Look', desc: 'Showcasing our dedication to supreme fit and personal tailoring.' },
        { file: 'r21.jpeg', title: 'Client Milestone Moment', desc: 'Celebrating success and special milestones in custom Mr. Sewing attire.' },
        { file: 'r22.jpeg', title: 'Refined Tailoring Project', desc: 'Custom garment crafted to highlight individual style and posture.' },
        { file: 'r23.jpeg', title: 'Signature Suit Design', desc: 'Exclusive fabric pairing and hand-finished detailing.' },
        { file: ' r24.jpeg', title: 'Elite Custom Suiting', desc: 'Crafted for leaders, achievers, and connoisseurs of fine fashion.' },
        { file: 'r25.jpeg', title: 'Contemporary Bespoke', desc: 'Where modern aesthetics meet traditional master tailoring.' },

        { file: 'r32.jpeg', title: 'Distinguished Formal Wear', desc: 'Crafted for unforgettable evenings and celebrations.' },
        { file: 'r33.jpeg', title: 'Master Tailor Creation', desc: 'Uncompromising quality and attention to every detail.' },
        { file: 'r34.jpeg', title: 'Luxury Suiting Statement', desc: 'Elevating your wardrobe with custom bespoke masterpieces.' },
        { file: 'r35.jpeg', title: 'Tailored Perfection', desc: 'Designed for comfort, prestige, and timeless style.' },
        { file: 'r36.jpeg', title: 'Exclusive Client Fitting', desc: 'Real moments of satisfaction in custom Kigali tailoring.' },
        { file: 'r37.jpeg', title: 'Signature Collection Piece', desc: 'Crafted with passion and master sartorial expertise.' },

        { file: 'r39.jpeg', title: 'Atelier Spotlight Feature', desc: 'Proudly crafted in Kigali, Rwanda by Mr. Sewing.' },
        { file: 'r40.jpeg', title: 'Custom Tailored Distinction', desc: 'Celebrating style, precision, and personal achievement.' },
        { file: 'r41.jpeg', title: 'Masterpiece Suiting', desc: 'The pinnacle of bespoke fashion and custom tailoring.' },
        { file: 'r42.jpeg', title: 'Final Gallery Showcase', desc: 'A testament to craftsmanship, elegance, and happy clients.' },
        { file: 'r43.jpeg', title: 'Atelier Elite Showcase', desc: 'Uncompromising luxury and custom fit crafted to absolute perfection.' }
      ];

      const gridContainer = document.getElementById('workGrid');
      if (gridContainer) {
        let htmlContent = '';
        galleryItems.forEach(item => {
          htmlContent += `
            <div class="work-card">
              <button type="button" class="work-image-wrapper image-preview design-preview" data-design-image="${item.file}">
                <img src="${encodeURI(item.file)}" alt="${item.title} - Mr. Sewing" class="work-img" loading="lazy">
              </button>
              <div class="work-content">
                <div>
                  <span class="work-tag">Client Moment</span>
                  <h3 class="work-title">${item.title}</h3>
                  <p class="work-desc">${item.desc}</p>
                </div>
                <button type="button" class="detail-btn design-preview" data-design-image="${item.file}">View Design &amp; Enquire</button>
              </div>
            </div>
          `;
        });
        gridContainer.innerHTML = htmlContent;
      }
    });

    // Lightbox functions
    const modal = document.getElementById('lightboxModal');
    const modalImg = document.getElementById('lightboxImage');
    const closeBtn = document.getElementById('lightboxClose');

    function openLightbox(imgSrc, imgAlt) {
      if (modal && modalImg) {
        modalImg.src = imgSrc;
        modalImg.alt = imgAlt;
        modal.classList.add('open');
      }
    }

    function closeLightbox() {
      if (modal) {
        modal.classList.remove('open');
        modalImg.src = '';
      }
    }

    if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
    if (modal) {
      modal.addEventListener('click', function(e) {
        if (e.target === modal) closeLightbox();
      });
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>

</body>
</html>
