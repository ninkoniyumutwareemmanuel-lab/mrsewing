  <script>
    const imageDelivery = {"m1.jpeg":"width=\"715\" height=\"715\" decoding=\"async\" srcset=\"assets/images/m1-480.webp 480w, m1.jpeg 715w\" sizes=\"(max-width: 700px) 100vw, 50vw\"","m2.jpeg":"width=\"628\" height=\"658\" decoding=\"async\" srcset=\"assets/images/m2-480.webp 480w, m2.jpeg 628w\" sizes=\"(max-width: 700px) 100vw, 50vw\"","m3.jpeg":"width=\"572\" height=\"715\" decoding=\"async\" srcset=\"m3.jpeg 572w\" sizes=\"(max-width: 700px) 100vw, 50vw\"","m4.jpeg":"width=\"657\" height=\"658\" decoding=\"async\" srcset=\"assets/images/m4-480.webp 480w, m4.jpeg 657w\" sizes=\"(max-width: 700px) 100vw, 50vw\"","m5.jpeg":"width=\"704\" height=\"938\" decoding=\"async\" srcset=\"assets/images/m5-480.webp 480w, m5.jpeg 704w\" sizes=\"(max-width: 700px) 100vw, 50vw\""};

    // Two-Piece Suits Registry
    const twoPiecePhotos = [
      { id: "2p-1", file: "m1.jpeg", title: "EXECUTIVE TWO-PIECE", subtitle: "Two-Piece Suit Line" },
      { id: "2p-2", file: "m2.jpeg", title: "DIPLOMATIC TWO-PIECE", subtitle: "Two-Piece Suit Line" },
      { id: "2p-3", file: "m3.jpeg", title: "CLASSIC SINGLE-BREASTED", subtitle: "Two-Piece Suit Line" }
    ];

    // Three-Piece Suits Registry
    const threePiecePhotos = [
      { id: "3p-1", file: "m4.jpeg", title: "ROYAL THREE-PIECE SUIT", subtitle: "Three-Piece Set (Jacket, Vest, Trousers)" },
      { id: "3p-2", file: "m5.jpeg", title: "STATESMAN THREE-PIECE", subtitle: "Three-Piece Set (Jacket, Vest, Trousers)" }
    ];

    /* Dynamic Component Loader Script */
    (async function loadComponents() {
      const components = [
        { id: 'site-header', file: 'header.html' },
        { id: 'site-footer', file: 'footer.html' }
      ];

      await Promise.allSettled(components.map(async (component) => {
        const mount = document.getElementById(component.id);
        if (!mount) return;
        try {
          const response = await fetch(component.file, { cache: 'no-cache' });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          mount.innerHTML = await response.text();
          mount.dataset.loaded = 'true';
        } catch (error) {
          console.error('Could not load ' + component.file + ':', error);
          mount.dataset.loaded = 'false';
        }
      }));

      document.documentElement.dataset.componentsLoaded = 'true';
      document.dispatchEvent(new CustomEvent('sitecomponentsloaded'));
    })();

    document.addEventListener('DOMContentLoaded', function() {
      renderGrid('twoPieceGrid', twoPiecePhotos);
      renderGrid('threePieceGrid', threePiecePhotos);
    });

    function renderGrid(containerId, photosArray) {
      const grid = document.getElementById(containerId);
      if (!grid) return;
      grid.innerHTML = '';

      photosArray.forEach(photo => {
        const card = document.createElement('article');
        card.className = 'photo-card';
        card.innerHTML = `
          <div class="photo-img-wrapper">
            <button type="button" class="design-preview image-preview" data-design-image="${photo.file}">
              <img ${imageDelivery[photo.file] || ''} src="${photo.file}" alt="${photo.title} - ${photo.subtitle} by Mr. Sewing Kigali" class="photo-img" loading="lazy">
            </button>
          </div>
          <div class="photo-info">
            <div>
              <div class="photo-title-text">${photo.title}</div>
              <div class="photo-subtitle-text">${photo.subtitle}</div>
            </div>
            <button type="button" class="view-details-btn design-preview" data-design-image="${photo.file}">View Design &amp; Enquire</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }
  </script>
