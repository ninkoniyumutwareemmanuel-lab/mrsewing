<style>
:root{--bg:#0d0d0d;--card:#141414;--gold:#c5a059;--gold2:#d4af37;--text:#f4f4f4;--muted:#aaa;--line:#262626}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
#site-header{width:100%;position:sticky;top:0;z-index:1000}
.load-error{color:#777;text-align:center;padding:16px 10px;font-size:.9rem}
.container{max-width:900px;margin:0 auto;padding:3rem 1.5rem}
.page-title{text-align:center;margin-bottom:2.5rem}
.about-logo{width:110px;height:110px;object-fit:contain;margin-bottom:1.2rem;border-radius:50%;border:2px solid var(--gold);padding:10px;background:var(--card)}
.page-title h1{font-size:2.4rem;color:var(--gold);margin-bottom:.4rem;letter-spacing:1px}
.page-title p{color:var(--muted);font-size:1.05rem}
.updated{display:block;margin-top:.5rem;color:#aaa;font-size:.85rem}
.box,.sec{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:1.6rem}
.box{padding:1.6rem 1.8rem}
.sec{padding:2rem 2.2rem}
.box h2,.sec h2{color:var(--gold);font-size:1.4rem;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--line)}
.sec h3{font-size:1.05rem;margin:1.2rem 0 .4rem;color:#e6e6e6}
p,li{color:var(--muted);font-size:1rem;margin-bottom:.7rem}
ul,ol{padding-left:1.4rem;margin-bottom:.8rem}
b{color:#ddd;font-weight:600}
a{color:var(--gold);text-decoration:none;overflow-wrap:anywhere}
a:hover{color:var(--gold2);text-decoration:underline}
.toc ol{columns:2;column-gap:2rem}
.toc li{break-inside:avoid;margin-bottom:.35rem;font-size:.95rem}
.glance ul{list-style:none;padding:0}
.glance li{padding:.35rem 0 .35rem 1.2rem;position:relative;margin:0;border-bottom:1px solid var(--line)}
.glance li:last-child{border:0}
.glance li:before{content:"\2022";color:var(--gold2);position:absolute;left:0}
.note{border-left:3px solid var(--gold);background:#101010;padding:1rem 1.2rem;border-radius:4px;margin:1rem 0 .4rem}
.note p{margin:0;color:#ccc}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin:.6rem 0 1rem;font-size:.95rem}
th,td{border:1px solid var(--line);padding:.55rem .8rem;text-align:left;color:var(--muted)}
th{background:#0d0d0d;color:var(--gold)}
@media(max-width:768px){html{scroll-padding-top:130px}.container{padding:2rem 1rem}.page-title h1{font-size:1.9rem}.sec{padding:1.5rem 1.2rem}.box{padding:1.3rem 1.1rem}.toc ol{columns:1}}
.container p a{text-decoration:underline;text-underline-offset:3px}</style>
