<!DOCTYPE html>
<html lang="en">
<head>
  <script data-legacy-url>if (location.pathname === "/index.html") location.replace("/" + location.search + location.hash);</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>document.documentElement.classList.add("js");</script>
  {{hero_preloads}}
  {{head_metadata}}
  <meta name="geo.region" content="RW-01">
  <meta name="geo.placename" content="Kigali, Rwanda">
  <meta name="theme-color" content="#0b0b0b">
  {{agent_discovery}}

  <!-- One homepage visual system; local icons, no runtime style injection. -->
  <style>
{{section_styles}}
  </style>
  <script src="assets/homepage.js" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <!-- Homepage navigation included at build time. -->
  <div id="site-header" class="site-component">
{{header}}
    </div>

  <main id="main-content">
    <!-- Homepage content is rendered at build time; no document fetches. -->
    <div id="hero-section" class="site-component">
{{hero}}
    </div>
    {{content_offers}}
    <div id="services-section" class="site-component">{{services}}</div>
    <div id="information-section" class="site-component">{{information}}</div>
    <div id="process-section" class="site-component">{{process}}</div>
    {{suit_collections}}
    <div id="benefits-section" class="site-component">{{benefits}}</div>
    {{recent_work}}
    <div id="options-section" class="site-component">{{options}}</div>
    <div id="customers-section" class="site-component">{{customers}}</div>
    <div id="programs-section" class="site-component">{{programs}}</div>
    <div id="final-section" class="site-component">{{final}}</div>
    <div id="contact-section" class="site-component">{{payment_methods}}
{{contact}}</div>
  </main>



  <!-- Homepage-specific footer; standalone pages retain their shared footer. -->
  <div id="site-footer" class="site-component">
{{footer}}
    </div>

  <noscript>
    <p style="padding:20px;text-align:center;color:#f5f5f5;background:#141414;">
      Browse our collections and consultation links above. Use the links to contact us directly. Enable JavaScript for form submission and the design-sharing consent popup.
    </p>
  </noscript>

</body>
</html>
