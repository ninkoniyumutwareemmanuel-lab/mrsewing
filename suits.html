  <!-- SCRIPT: HEADER FETCH, 24-HOUR MIDNIGHT SHUFFLE & CAROUSEL BUILDER -->
  <script>
    // 1. Fetch header.html dynamically
    fetch('header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-container').innerHTML = data;
      })
      .catch(err => console.error('Header fetch failed:', err));

    // Base raw file lists
    const rawFeaturedFiles = ['s1.jpeg', 's2.jpeg', 's3.jpeg', 's4.jpeg', 's5.jpeg', 's6.jpeg', 's7.jpeg', 's8.jpeg', 's9.jpeg', 's10.jpeg'];
    const rawTwoPiecesFiles = ['w1.jpeg', 'w2.jpeg', 'w3.jpeg', 'w4.jpeg', 'w5.jpeg', 'w6.jpeg', 'w7.jpeg', 'w8.jpeg', 'w9.jpeg', 'w10.jpeg'];
    const rawThreePiecesFiles = ['m1.jpeg', 'm2.jpeg', 'm3.jpeg', 'm4.jpeg', 'm5.jpeg', 'm6.jpeg', 'm7.jpeg', 'm8.jpeg', 'm9.jpeg', 'm10.jpeg'];
    const rawMadeByUsFiles = ['r1.jpeg', 'r1.2.jpeg', 'r1.3.jpeg', 'r2.jpeg', 'r3.jpeg', 'r3.4.jpeg', 'r3.5.jpeg', 'r4.jpeg', 'r5.jpeg', 'r6.jpeg', 'r7.jpeg', 'r8.jpeg', 'r9.jpeg', 'r10.jpeg'];

    // 2. 24-Hour Midnight Shuffling Logic based on Rwanda Time (Africa/Kigali)
    function getDailyShuffledFiles(storageKey, array) {
      const todayKigali = new Date().toLocaleDateString('en-CA', { timeZone: 'Africa/Kigali' });
      let storedDate = localStorage.getItem(storageKey + '_date');
      let storedArr = localStorage.getItem(storageKey + '_arr');

      if (!storedDate || storedDate !== todayKigali || !storedArr) {
        let arr = [...array];
        // Shuffle algorithm
        for (let i = arr.length - 1; i > 0; i--) {
          let j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        localStorage.setItem(storageKey + '_date', todayKigali);
        localStorage.setItem(storageKey + '_arr', JSON.stringify(arr));
        return arr;
      } else {
        return JSON.parse(storedArr);
      }
    }

    const featuredSuitsFiles = getDailyShuffledFiles('featuredSuits', rawFeaturedFiles);
    const twoPiecesFiles = getDailyShuffledFiles('twoPiecesSuits', rawTwoPiecesFiles);
    const threePiecesFiles = getDailyShuffledFiles('threePiecesSuits', rawThreePiecesFiles);
    const madeByUsFiles = getDailyShuffledFiles('madeByUs', rawMadeByUsFiles);

    // Carousel scroll helper for arrow buttons (< and >)
    function scrollCarousel(containerId, distance) {
      const container = document.getElementById(containerId);
      if (container) {
        container.scrollBy({ left: distance, behavior: 'smooth' });
      }
    }

    // Modern in-button copy feedback function
    function copyLinkWithFeedback(buttonElement, urlToCopy) {
      navigator.clipboard.writeText(urlToCopy).then(() => {
        const originalHTML = buttonElement.innerHTML;
        buttonElement.innerHTML = '<i class="fas fa-check"></i> Copied!';
        buttonElement.classList.add('copied');
        setTimeout(() => {
          buttonElement.innerHTML = originalHTML;
          buttonElement.classList.remove('copied');
        }, 2000);
      }).catch(err => {
        console.error('Copy failed: ', err);
      });
    }

    // Lightbox Elements
    const lightbox = document.getElementById('lightboxModal');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');

    function openLightbox(imgSrc) {
      lightboxImg.src = imgSrc;
      lightbox.classList.add('open');
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function(e) { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });

    // Populate Carousel Helper
    function populateCarousel(fileList, containerId) {
      const container = document.getElementById(containerId);
      if (!container) return;

      fileList.forEach(imgFile => {
        const fullPhotoUrl = window.location.origin + '/' + imgFile;
        const baseName = imgFile.substring(0, imgFile.lastIndexOf('.')).replace('.', '-');
        const detailPageUrl = `detail-${baseName}.html`;
        const shareText = encodeURIComponent(`Hey Mr. Sewing, I am interested in this exact style from your gallery: ${fullPhotoUrl}`);
        const whatsappUrl = `https://wa.me/250787411501?text=${shareText}`;

        const card = document.article || document.createElement('article');
        card.className = 'gallery-card';

        // Check if image exists before rendering
        const imgTest = new Image();
        imgTest.src = imgFile;
        imgTest.onload = function() {
          card.innerHTML = `
            <div class="card-img-wrapper" onclick="openLightbox('${imgFile}')">
              <img src="${imgFile}" alt="Bespoke tailoring style - Mr. Sewing Kigali" loading="lazy">
            </div>
            <div class="card-actions">
              <a href="${whatsappUrl}" target="_blank" rel="noopener" class="action-btn whatsapp" title="Share exact photo">
                <i class="fab fa-whatsapp"></i> Share
              </a>
              <button class="action-btn" onclick="copyLinkWithFeedback(this, '${fullPhotoUrl}')" title="Copy photo link">
                <i class="fas fa-link"></i> Copy
              </button>
              <a href="${detailPageUrl}" class="action-btn details" title="View pricing and details">
                <i class="fas fa-info-circle"></i> Details
              </a>
            </div>
          `;
          container.appendChild(card);
        };
      });
    }

    // Initialize Carousels with the daily shuffled order
    populateCarousel(featuredSuitsFiles, 'featuredSuitsCarousel');
    populateCarousel(twoPiecesFiles, 'twoPiecesCarousel');
    populateCarousel(threePiecesFiles, 'threePiecesCarousel');
    populateCarousel(madeByUsFiles, 'madeByUsCarousel');
  </script>
