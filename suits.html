  <!-- SCRIPT: 24-HOUR 50-PHOTO ROTATION & PERFORMANCE BATCH LOADING -->
  <script>
    // Generate master list of all potential photo files up to 1000+
    function generateAllFiles() {
      let pool = [];
      const maxLimit = 1000;
      for (let i = 1; i <= maxLimit; i++) pool.push(`m${i}.jpeg`);
      for (let i = 1; i <= maxLimit; i++) pool.push(`w${i}.jpeg`);
      for (let i = 1; i <= maxLimit; i++) pool.push(`h${i}.jpeg`);
      for (let i = 1; i <= maxLimit; i++) pool.push(`r${i}.jpeg`);
      return pool;
    }

    const allFiles = generateAllFiles();

    // Shuffle Function
    function shuffleArray(array) {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 24-Hour Rotating Pool Logic (Refreshes shuffled queue every 24 hours)
    function getDailyGalleryPool() {
      const now = new Date().getTime();
      const twentyFourHours = 24 * 60 * 60 * 1000;
      
      let storedTime = localStorage.getItem('mrSewing_poolTime');
      let storedPool = localStorage.getItem('mrSewing_shuffledPool');

      if (!storedTime || !storedPool || (now - storedTime > twentyFourHours)) {
        // Time expired or first visit: create a brand new 24-hour shuffle
        const newShuffled = shuffleArray(allFiles);
        localStorage.setItem('mrSewing_poolTime', now);
        localStorage.setItem('mrSewing_shuffledPool', JSON.stringify(newShuffled));
        return newShuffled;
      } else {
        return JSON.parse(storedPool);
      }
    }

    const dailyPool = getDailyGalleryPool();
    let currentIndex = 0;
    const batchSize = 50; // Loads 50 photos per batch for maximum performance

    // Modern in-button copy feedback function
    function copyLinkWithFeedback(buttonElement, urlToCopy) {
      navigator.clipboard.writeText(urlToCopy).then(() => {
        const originalHTML = buttonElement.innerHTML;
        buttonElement.innerHTML = '<i class="fas fa-check"></i> Copied!';
        buttonElement.classList.add('copied');
        setTimeout(() => {
          buttonElement.innerHTML = originalHTML;
          buttonElement.classList.remove('copied');
        }, 2000);
      }).catch(err => {
        console.error('Copy failed: ', err);
      });
    }

    const grid = document.getElementById('infiniteGrid');
    const loader = document.getElementById('infiniteLoader');

    // Lightbox Elements
    const lightbox = document.getElementById('lightboxModal');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxWaBtn = document.getElementById('lightboxWaBtn');
    const lightboxCopyBtn = document.getElementById('lightboxCopyBtn');
    const lightboxDetailsBtn = document.getElementById('lightboxDetailsBtn');
    const lightboxClose = document.getElementById('lightboxClose');

    function openLightbox(imgSrc, fullPhotoUrl, detailPageUrl) {
      lightboxImg.src = imgSrc;
      const shareText = encodeURIComponent(`Hey Mr. Sewing, I am interested in this exact style from your gallery: ${fullPhotoUrl}`);
      lightboxWaBtn.href = `https://wa.me/250787411501?text=${shareText}`;
      lightboxDetailsBtn.href = detailPageUrl;
      lightbox.classList.add('open');
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function(e) { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });

    function loadNextBatch() {
      if (currentIndex >= dailyPool.length) {
        loader.innerHTML = "All styles displayed for today. Check back tomorrow for fresh photos!";
        return;
      }

      const nextBatch = dailyPool.slice(currentIndex, currentIndex + batchSize);
      currentIndex += batchSize;

      nextBatch.forEach(imgFile => {
        const fullPhotoUrl = window.location.origin + '/' + imgFile;
        const baseName = imgFile.substring(0, imgFile.lastIndexOf('.'));
        const detailPageUrl = `detail-${baseName}.html`;
        const shareText = encodeURIComponent(`Hey Mr. Sewing, I am interested in this exact style from your gallery: ${fullPhotoUrl}`);
        const whatsappUrl = `https://wa.me/250787411501?text=${shareText}`;

        const card = document.createElement('article');
        card.className = 'gallery-card';
        
        // Smart loader check: only renders cards for files that actually exist
        const imgTest = new Image();
        imgTest.src = imgFile;
        imgTest.onload = function() {
          card.innerHTML = `
            <div class="card-img-wrapper" onclick="openLightbox('${imgFile}', '${fullPhotoUrl}', '${detailPageUrl}')">
              <img src="${imgFile}" alt="Bespoke suit style - Mr. Sewing Kigali" loading="lazy">
            </div>
            <div class="card-actions">
              <a href="${whatsappUrl}" target="_blank" rel="noopener" class="action-btn whatsapp" title="Share exact photo">
                <i class="fab fa-whatsapp"></i> Share
              </a>
              <button class="action-btn" onclick="copyLinkWithFeedback(this, '${fullPhotoUrl}')" title="Copy photo link">
                <i class="fas fa-link"></i> Copy
              </button>
              <a href="${detailPageUrl}" class="action-btn details" title="View pricing and details">
                <i class="fas fa-info-circle"></i> Details
              </a>
            </div>
          `;
          grid.appendChild(card);
        };
      });
    }

    // Initial load
    loadNextBatch();

    // Infinite scroll listener to load next batch of 50
    window.addEventListener('scroll', () => {
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 600) {
        loader.style.display = 'block';
        setTimeout(() => {
          loadNextBatch();
          loader.style.display = 'none';
        }, 300);
      }
    });
  </script>
