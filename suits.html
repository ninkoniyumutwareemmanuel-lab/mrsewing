  <div class="lightbox-overlay" id="lightboxModal" role="dialog" aria-modal="true">
    <div class="lightbox-container">
      <button class="lightbox-close" id="lightboxClose" aria-label="Close Viewer">&times;</button>
      <img src="" alt="Full size preview - Mr. Sewing Kigali" class="lightbox-img" id="lightboxImg">
    </div>
  </div>

  <!-- SCRIPT: MANUAL EXPLICIT LISTING & CAROUSEL BUILDER -->
  <script>
    // Explicit lists of your photo files. Update these arrays whenever you add new photos!
    const womenFiles = ['w1.jpeg', 'w2.jpeg', 'w3.jpeg', 'w4.jpeg', 'w5.jpeg'];
    const menFiles = ['m1.jpeg', 'm2.jpeg', 'm3.jpeg', 'm4.jpeg', 'm5.jpeg', 'm6.jpeg'];
    const madeByUsFiles = ['r1.jpeg']; // Add your "Made By Us" files here (e.g. r1.jpeg, r2.jpeg, etc.)

    // Modern in-button copy feedback function
    function copyLinkWithFeedback(buttonElement, urlToCopy) {
      navigator.clipboard.writeText(urlToCopy).then(() => {
        const originalHTML = buttonElement.innerHTML;
        buttonElement.innerHTML = '<i class="fas fa-check"></i> Copied!';
        buttonElement.classList.add('copied');
        setTimeout(() => {
          buttonElement.innerHTML = originalHTML;
          buttonElement.classList.remove('copied');
        }, 2000);
      }).catch(err => {
        console.error('Copy failed: ', err);
      });
    }

    // Lightbox Elements
    const lightbox = document.getElementById('lightboxModal');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');

    function openLightbox(imgSrc) {
      lightboxImg.src = imgSrc;
      lightbox.classList.add('open');
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function(e) { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });

    // Populate Carousel Helper
    function populateCarousel(fileList, containerId) {
      const container = document.getElementById(containerId);
      if (!container) return;

      fileList.forEach(imgFile => {
        const fullPhotoUrl = window.location.origin + '/' + imgFile;
        const baseName = imgFile.substring(0, imgFile.lastIndexOf('.'));
        const detailPageUrl = `detail-${baseName}.html`;
        const shareText = encodeURIComponent(`Hey Mr. Sewing, I am interested in this exact style from your gallery: ${fullPhotoUrl}`);
        const whatsappUrl = `https://wa.me/250787411501?text=${shareText}`;

        const card = document.createElement('article');
        card.className = 'gallery-card';

        // Check if image exists before rendering
        const imgTest = new Image();
        imgTest.src = imgFile;
        imgTest.onload = function() {
          card.innerHTML = `
            <div class="card-img-wrapper" onclick="openLightbox('${imgFile}')">
              <img src="${imgFile}" alt="Bespoke tailoring style - Mr. Sewing Kigali" loading="lazy">
            </div>
            <div class="card-actions">
              <a href="${whatsappUrl}" target="_blank" rel="noopener" class="action-btn whatsapp" title="Share exact photo">
                <i class="fab fa-whatsapp"></i> Share
              </a>
              <button class="action-btn" onclick="copyLinkWithFeedback(this, '${fullPhotoUrl}')" title="Copy photo link">
                <i class="fas fa-link"></i> Copy
              </button>
              <a href="${detailPageUrl}" class="action-btn details" title="View pricing and details">
                <i class="fas fa-info-circle"></i> Details
              </a>
            </div>
          `;
          container.appendChild(card);
        };
      });
    }

    // Initialize Carousels
    populateCarousel(womenFiles, 'womensCarousel');
    populateCarousel(menFiles, 'mensCarousel');
    populateCarousel(madeByUsFiles, 'madeByUsCarousel');
  </script>
